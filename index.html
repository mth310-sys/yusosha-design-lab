<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遊創舎 Design Lab</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header>
    <h1>遊創舎 Design Lab</h1>
    <p>Frame Designer Ver.0.1</p>
</header>

<section class="preview">

    <div class="preview-title">
        Preview
    </div>

    <div class="preview-area">

        <div class="canvas-guide">

            <div id="top-frame"></div>

            <div class="center-line vertical"></div>
            <div class="center-line horizontal"></div>

        </div>

    </div>

</section>

<nav class="tabs">

    <button class="tab active" data-tab="top">
        Top
    </button>

    <button class="tab" data-tab="side">
        Side
    </button>

    <button class="tab" data-tab="base">
        Base
    </button>

</nav>

<section id="editor">

    <h3>Top編集</h3>

    <label>
        高さ

        <input
            type="range"
            id="topHeight"
            min="40"
            max="180"
            value="80"
        >
    </label>

    <span id="topValue">80px</span>

    <br><br>

    <label>
        分割数

        <select id="topSplit">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
        </select>
    </label>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
